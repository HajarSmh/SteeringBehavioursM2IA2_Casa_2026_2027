<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.8.0/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.1.0/dist/tf.min.js"></script>
  <title>Voiture</title>
  <style>
    :root{--cy:#00f5ff;--mg:#ff00cc;--vi:#8a2bff;--tx:#e6eaf7;--mu:#8d96b3}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(1200px 700px at 30% 0%,#14103a,#03020a);color:var(--tx);font:13px 'Inter',system-ui,sans-serif}
    #app{display:flex;gap:14px;padding:14px;align-items:flex-start}
    #canvas-holder{flex:1;min-width:0}
    canvas{max-width:100%;height:auto!important;border-radius:14px;box-shadow:0 0 50px rgba(0,245,255,.18),0 0 0 1px rgba(255,255,255,.1)}
    #panel{width:300px;max-height:calc(100vh - 28px);overflow:auto;padding:12px;border-radius:16px;background:rgba(12,10,30,.78);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 40px rgba(0,0,0,.5);scrollbar-width:thin}
    button{font:inherit;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 10px;cursor:pointer;transition:.15s}
    button:hover{background:rgba(255,255,255,.14)}
    button.on{background:linear-gradient(135deg,#00c8ff,#7a2bff);border-color:transparent;box-shadow:0 0 16px rgba(0,200,255,.45)}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:12px;background:rgba(0,0,0,.35)}
    .tabs button{border:0;background:none;padding:8px 2px;font-size:12px}
    .tabs button.on{box-shadow:none}
    .quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
    .cams{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
    .cams button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0}
    .cams span{font-size:18px}.cams small{font-size:10px;color:#cfd6f5}
    .sec{border-top:1px solid rgba(255,255,255,.08);padding:2px 0}
    .sec summary{cursor:pointer;list-style:none;padding:10px 2px;font-weight:600;letter-spacing:.03em;color:#fff}
    .sec summary::after{content:'▾';float:right;color:var(--mu)}
    .sec[open] summary::after{content:'▴'}
    .sec summary::-webkit-details-marker{display:none}
    h3{margin:12px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--cy)}
    .row{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin:8px 0;color:#cfd6f5}
    .row output{background:rgba(0,245,255,.12);color:var(--cy);padding:0 8px;border-radius:20px;font-size:11px;line-height:18px}
    .row input{grid-column:1/3;width:100%}
    input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:rgba(255,255,255,.18);outline:none}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--mg),0 0 0 3px rgba(255,0,204,.35);cursor:pointer}
    input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--mg)}
    select{width:100%;margin:6px 0;padding:8px;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px}
    select option{background:#14103a}
    label.chk{display:block;margin:6px 0;color:#cfd6f5;cursor:pointer}
    input[type=checkbox]{accent-color:var(--mg);margin-right:6px}
    .card{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:12px;padding:8px;margin:8px 0}
    .card header{display:flex;gap:6px;align-items:center}
    .card header input[type=text]{flex:1;min-width:0;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:5px 8px}
    .hrow{display:flex;gap:6px;align-items:center;margin:3px 0}
    .hrow span{flex:1;font-size:12px}
    #hallList{max-height:220px;overflow:auto;margin-bottom:6px}
    #hallInfo,#raceStatus{color:var(--mu);margin:8px 0}
    #race,#champ{display:none}
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-holder"></div>
    <aside id="panel">
      <div class="tabs"><button id="btnEvo" class="on">🧬 Évolution</button><button id="btnRace">🏁 Course</button><button id="btnChamp">🏆 Champions</button></div>
      <div class="quick"><button id="btnPause">⏸ Pause</button><button id="newTrack">🔄 Nouveau circuit</button></div>
      <div id="camBtns" class="cams"></div>
      <details class="sec" open><summary>🚗 Voitures</summary>
        <div id="evo"></div>
        <div id="hallInfo"></div>
        <div id="champ">
          <h3>Meilleurs cerveaux (1 par génération)</h3>
          <div id="hallList"></div>
          <button id="hallTop">Top 6</button> <button id="hallNone">Aucun</button> <button id="hallClear">Vider</button><br>
          <button id="hallStart" class="on" style="margin-top:6px">🏁 Lancer la course</button>
        </div>
        <div id="race">
          <h3>Équipes</h3><div id="cards"></div>
          <button id="addCar">+ Ajouter une voiture</button>
          <h3>Entraînement</h3><div id="trainBox"></div>
          <button id="train">🏋 Entraîner</button> <button id="start" class="on">🏁 Lancer la course</button>
          <div id="raceStatus"></div>
        </div>
      </details>
      <details class="sec"><summary>⚙️ Simulation</summary><div id="simctl"></div></details>
      <details class="sec"><summary>🛣 Circuit</summary><div id="track"></div></details>
      <details class="sec"><summary>🔊 Son</summary><div id="sndBox"></div></details>
      <details class="sec"><summary>👁 Affichage</summary>
        <label class="chk"><input type="checkbox" id="cLights">Feux des voitures</label>
        <label class="chk"><input type="checkbox" id="cRays">Rayons du leader</label>
        <label class="chk"><input type="checkbox" id="cCps">Checkpoints</label>
        <label class="chk"><input type="checkbox" id="cAutoPause" checked>Pause avec le gagnant</label>
        <label class="chk"><input type="checkbox" id="cDebug">Debug : cercles &amp; flèches (D)</label>
      </details>
      <div id="board" hidden></div>
    </aside>
  </div>
  <script src="nn.js"></script>
  <script src="ga.js"></script>
  <script src="ray.js"></script>
  <script src="boundary.js"></script>
  <script src="vehicle.js"></script>
  <script src="background.js"></script>
  <script src="track.js"></script>
  <script src="audio.js"></script>
  <script src="view3d.js"></script>
  <script src="hall.js"></script>
  <script src="sketch.js"></script>
  <script src="ui.js"></script>
  <script src="intro.js"></script>
</body>
</html>
